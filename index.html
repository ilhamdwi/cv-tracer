<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Apply Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 max-w-4xl">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-blue-600">💼 Job Tracker</h1>
            <p class="text-gray-600 text-sm">Sistem Pantau Lamaran Kerja Terintegrasi Spreadsheet</p>
        </header>

        <!-- Tab Navigasi Menu -->
        <div class="flex border-b border-gray-200 mb-6 bg-white rounded-t-lg shadow-sm overflow-hidden">
            <button id="tabInput" class="w-1/2 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-blue-50/50 transition">
                📝 Input Lamaran Baru
            </button>
            <button id="tabDaftar" class="w-1/2 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition">
                📋 Lihat Daftar Apply
            </button>
        </div>

        <!-- ================= HALAMAN 1: FORM INPUT ================= -->
        <div id="pageInput" class="block space-y-4">
            <div class="bg-white p-6 rounded-b-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-700 pb-2 border-b">Formulir Apply CV</h2>
                <form id="jobForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Tanggal Apply</label>
                        <input type="date" id="tanggal" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Nama Perusahaan</label>
                        <input type="text" id="perusahaan" placeholder="Contoh: PT. Tech Solusindo" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Posisi</label>
                        <select id="posisi" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="Backend Developer">Backend Developer</option>
                            <option value="Data Analyst">Data Analyst</option>
                            <option value="System Analyst">System Analyst</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Platform</label>
                        <select id="platform" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="JobStreet">JobStreet</option>
                            <option value="Direct Email">Direct Email</option>
                            <option value="Glints">Glints</option>
                            <option value="Kita Lulus">Kita Lulus</option>
                            <option value="Kalibrr">Kalibrr</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Status Awal</label>
                        <input type="text" id="status" value="Applied" class="w-full border bg-gray-100 rounded p-2 text-gray-500" readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Catatan / Link Lowongan</label>
                        <textarea id="catatan" rows="3" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Detail kualifikasi atau link..."></textarea>
                    </div>
                    
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-2.5 rounded hover:bg-blue-700 transition font-medium shadow-sm">
                        Kirim ke Spreadsheet
                    </button>
                </form>
                
                <div id="message" class="mt-4 text-center hidden p-2 rounded text-sm"></div>
            </div>
        </div>

        <!-- ================= HALAMAN 2: DAFTAR APPLY ================= -->
        <div id="pageDaftar" class="hidden space-y-4">
            <!-- Kumpulan Card Statistik Ringkas -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-gray-400">
                    <div class="text-gray-500 text-[10px] font-bold uppercase">Total Apply</div>
                    <div id="countTotal" class="text-xl font-bold text-gray-800 mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-blue-500">
                    <div class="text-gray-500 text-[10px] font-bold uppercase">Interview</div>
                    <div id="countInterview" class="text-xl font-bold text-blue-600 mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-green-500">
                    <div class="text-gray-500 text-[10px] font-bold uppercase">Offering</div>
                    <div id="countOffering" class="text-xl font-bold text-green-600 mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-red-500">
                    <div class="text-gray-500 text-[10px] font-bold uppercase">Rejected</div>
                    <div id="countRecorded" class="text-xl font-bold text-red-600 mt-1">0</div>
                </div>
            </div>

            <!-- Tabel Data -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                    <h2 class="font-bold text-gray-700">History Lamaran Kerja</h2>
                    <button id="refreshBtn" class="bg-white border hover:bg-gray-50 text-gray-700 px-3 py-1 rounded text-xs font-medium shadow-sm transition">
                        🔄 Refresh
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full table-auto text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100/70 text-gray-500 uppercase text-[10px] tracking-wider border-b">
                                <th class="p-3 font-semibold">Perusahaan</th>
                                <th class="p-3 font-semibold">Posisi & Media</th>
                                <th class="p-3 font-semibold">Status</th>
                                <th class="p-3 font-semibold">Catatan / Link</th>
                            </tr>
                        </thead>
                        <tbody id="jobTableBody" class="text-sm">
                            <tr>
                                <td colspan="4" class="p-6 text-center text-gray-500 animate-pulse">Memuat data dari Spreadsheet...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // URL APPS SCRIPT ANDA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw7-GHeVweqSZ8yPZeCjN52OvHX5VsEzHy9aYQftSAVhUGMzjos_AqOSnmNpvZhhBEJ/exec";

        // Set otomatis tanggal hari ini
        document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

        // --- LOGIKA TAB NAVIGATION ---
        const tabInput = document.getElementById('tabInput');
        const tabDaftar = document.getElementById('tabDaftar');
        const pageInput = document.getElementById('pageInput');
        const pageDaftar = document.getElementById('pageDaftar');

        tabInput.addEventListener('click', () => {
            switchTab(tabInput, tabDaftar, pageInput, pageDaftar);
        });

        tabDaftar.addEventListener('click', () => {
            switchTab(tabDaftar, tabInput, pageDaftar, pageInput);
            fetchJobs(); // Ambil data terbaru setiap kali tab daftar dibuka
        });

        function switchTab(activeTab, inactiveTab, activePage, inactivePage) {
            // Ubah style tombol tab yang aktif
            activeTab.className = "w-1/2 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-blue-50/50 transition";
            inactiveTab.className = "w-1/2 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition";
            
            // Munculkan / sembunyikan halaman
            activePage.classList.remove('hidden');
            activePage.classList.add('block');
            inactivePage.classList.remove('block');
            inactivePage.classList.add('hidden');
        }


        // --- LOGIKA FETCH DATA (GET) ---
        function fetchJobs() {
            const tableBody = document.getElementById('jobTableBody');
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;

            fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                tableBody.innerHTML = '';
                if (!data || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500">Belum ada data lamaran.</td></tr>`;
                    updateMetrics([]);
                    return;
                }

                updateMetrics(data);

                // Urutkan dari data terbaru (reverse)
                data.reverse().forEach(job => {
                    let tglDisplay = job.tanggal ? (job.tanggal.includes('T') ? job.tanggal.split('T')[0] : job.tanggal) : '-';
                    
                    let statusColor = 'bg-yellow-100 text-yellow-800';
                    const statusLower = job.status ? job.status.toLowerCase() : '';
                    if (statusLower.includes('interview')) statusColor = 'bg-blue-100 text-blue-800';
                    if (statusLower.includes('test')) statusColor = 'bg-purple-100 text-purple-800';
                    if (statusLower === 'offering') statusColor = 'bg-green-100 text-green-800';
                    if (statusLower === 'rejected' || statusLower === 'ghosting') statusColor = 'bg-red-100 text-red-800';

                    const row = `
                        <tr class="border-b hover:bg-gray-50 transition">
                            <td class="p-3">
                                <strong class="text-gray-900 block">${job.perusahaan || '-'}</strong>
                                <span class="text-xs text-gray-400">${tglDisplay}</span>
                            </td>
                            <td class="p-3">
                                <span class="block font-medium text-gray-700 text-xs">${job.posisi || '-'}</span>
                                <span class="inline-block bg-gray-200 text-[9px] font-bold px-1.5 py-0.5 rounded text-gray-600 mt-0.5">${job.platform || '-'}</span>
                            </td>
                            <td class="p-3">
                                <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${statusColor}">
                                    ${job.status || 'Applied'}
                                </span>
                            </td>
                            <td class="p-3 text-xs text-gray-500 max-w-xs break-words">
                                ${job.catatan ? linkify(job.catatan) : '-'}
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500">Gagal memuat data. Periksa pengaturan 'doGet' di Apps Script.</td></tr>`;
            })
            .finally(() => {
                refreshBtn.disabled = false;
            });
        }

        function updateMetrics(data) {
            document.getElementById('countTotal').innerText = data.length;
            document.getElementById('countInterview').innerText = data.filter(j => j.status && j.status.toLowerCase().includes('interview')).length;
            document.getElementById('countOffering').innerText = data.filter(j => j.status && j.status.toLowerCase() === 'offering').length;
            document.getElementById('countRecorded').innerText = data.filter(j => j.status && (j.status.toLowerCase() === 'rejected' || j.status.toLowerCase() === 'ghosting')).length;
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" class="text-blue-600 hover:underline font-medium break-all">' + url + '</a>';
            });
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchJobs);


        // --- LOGIKA KIRIM DATA (POST) ---
        document.getElementById('jobForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Mengirim...";
            messageDiv.classList.add('hidden');

            const payload = {
                tanggal: document.getElementById('tanggal').value,
                perusahaan: document.getElementById('perusahaan').value,
                posisi: document.getElementById('posisi').value,
                platform: document.getElementById('platform').value,
                status: document.getElementById('status').value,
                catatan: document.getElementById('catatan').value
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                messageDiv.innerText = "🎉 Sukses! Data berhasil dikirim ke Spreadsheet.";
                messageDiv.className = "mt-4 text-center p-2 rounded text-sm bg-green-100 text-green-800";
                document.getElementById('jobForm').reset();
                document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
            })
            .catch(error => {
                messageDiv.innerText = "❌ Gagal mengirim data: " + error;
                messageDiv.className = "mt-4 text-center p-2 rounded text-sm bg-red-100 text-red-800";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kirim ke Spreadsheet";
            });
        });
    </script>
</body>
</html>
